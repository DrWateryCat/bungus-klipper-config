# This file is yours! Feel free to edit it in order to include all the needed
# things to adapt my generic config to your machine. This file will not be erased
# when updating the config using moonraker and it will be kept as you've set it.
# You can change every section of the config. You can also add some new custom macros, etc...
# The corresponding documentation can be found in: docs > overrides.md

### Also, keep in mind: if you use a multi-MCU config such as the old school double SKRs or a CANbus toolhead
### board, you will need to specify which components are connected to which board in your own mcu.cfg file!
### Example: if something is connected to the toolhead MCU, you should use "config_pin: toolhead:PIN_NAME".

#> Main control MCUs are called "mcu" (and "secondary" when using a double MCU configuration)
#> Toolhead CANboard MCUs are called "toolhead"
#> MMU/ERCF MCUs are called "mmu" 

# ------------------------------------------------------------------------------------------


#-------------------------#
#   EXTRUDER/BED PIDs     #
#-------------------------#

## Here is an example of some overrides for the PIDs. I put them here as almost everyone will use them,
## so just uncomment the following lines and change the values according to your own machine
[extruder]
sensor_type: PT1000
pullup_resistor: 2200
control: pid
pid_kp: 29.375
pid_ki: 3.817
pid_kd: 55.838
max_temp: 325

#pid_Kp=20.375 pid_Ki=1.132 pid_Kd=91.686
#pid_Kp=16.404 pid_Ki=0.688 pid_Kd=97.808
#pid_Kp=29.197 pid_Ki=3.817 pid_Kd=55.838

# [heater_bed]
# control: pid
# pid_kp: 38.771
# pid_ki: 1.746
# pid_kd: 215.177

[stepper_y]
position_max: 360
position_endstop: 360

[heater_bed]
control = pid
pid_kp = 53.985
pid_ki = 1.621
pid_kd = 449.426

[neopixel caselight]
pin: PD15
chain_count: 25
color_order: GRB

[filament_switch_sensor runout_sensor]
switch_pin: !toolhead:RUNOUT_SENSOR

[adxl345]
axes_map: x,-y,-z

[resonance_tester]
accel_chip: adxl345
probe_points:
    -1,-1,-1

[include macros/helpers/resonance_override.cfg]
[include scripts/K-ShakeTune/K-SnT_*.cfg]

#-------------------------#
#   Z MOTORS DIRECTION    #
#-------------------------#

## Here is an example of some overrides for the motor directions as it's a pretty common one. If you need
## to invert the Z1 or Z3 motor direction on your machine, just uncomment the following lines.
[stepper_z1]
dir_pin: !Z1_DIR

[stepper_z3]
dir_pin: !Z3_DIR

[tmc2209 stepper_x]
sense_resistor: 0.110
driver_SGTHRS: 255

[tmc2209 stepper_y]
sense_resistor: 0.110
driver_SGTHRS: 255

[tmc2209 stepper_z]
sense_resistor: 0.110

[tmc2209 stepper_z1]
sense_resistor: 0.110

[tmc2209 stepper_z2]
sense_resistor: 0.110

[tmc2209 stepper_z3]
sense_resistor: 0.110


#-------------------------#
#   Probe Offsets         #
#-------------------------#

## Here is an example of some overrides for bed probes. These frequently have calibrated offsets for xyz,
## and many will need them during setup. If you need to set these, just uncomment the following lines.
# [probe]
# x_offset: -1.85
# y_offset: 29.3
# z_offset: 12.6

#[scanner]
#   Offsets are measured from the centre of your coil, to the tip of your nozzle 
#   on a level axis. It is vital that this is accurate. 
#x_offset: 0                          
#    adjust for your cartographers offset from nozzle to middle of coil
#y_offset: 21                       
#    adjust for your cartographers offset from nozzle to middle of coil
#backlash_comp: 0.56036
#   Backlash compensation distance for removing Z backlash before measuring
#   the sensor response.
#sensor: cartographer
#sensor_alt: carto   
#mesh_runs: 2
#scanner_touch_location: 175, 175

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 20

[cartographer scan]
mesh_runs: 2

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[bed_mesh]
probe_count: 30, 30

[fan_generic filter]
off_below: 0.1

[autotune_tmc stepper_x]
motor: ldo-42sth48-2504ah
[autotune_tmc stepper_y]
motor: ldo-42sth48-2504ah

[autotune_tmc stepper_z]
motor: ldo-42sth48-2004ac
[autotune_tmc stepper_z1]
motor: ldo-42sth48-2004ac
[autotune_tmc stepper_z2]
motor: ldo-42sth48-2004ac
[autotune_tmc stepper_z3]
motor: ldo-42sth48-2004ac

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg

[input_shaper]
shaper_freq_x: 53.0
shaper_type_x: mzv
damping_ratio_x: 0.068
shaper_freq_y: 39.2
shaper_type_y: mzv
damping_ratio_y: 0.093

[multi_pin part_cooling_fan]
pins: toolhead:PART_FAN1,toolhead:PART_FAN2

[fan]
pin=multi_pin:part_cooling_fan
# pin: toolhead:PART_FAN1, toolhead:PART_FAN2

[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: CHAMBER_TEMPERATURE

[skew_correction]

[gcode_macro _MODULE_CUSTOM1]
gcode:
  SKEW_PROFILE LOAD=Califlower

[gcode_macro _MODULE_CUSTOM2]
gcode:
  SET_SKEW CLEAR=1

[gcode_macro _MODULE_Z_CALIB]
gcode:
  # ----- Z CALIBRATION --------------------------------
  # If auto z calibration plugin is enabled, we measure the nozzle height using the physical Z endstop probe, followed by
  # a measurement of the probe on the physical Z endstop probe, and then a measurement of the center of the bed (or mesh)
  # If it's a TAP probe or inductive probe or no Z calibration, then it's only a G28 Z to get a correct Z offset measurement
  {% set zcalib_plugin_enabled = printer["gcode_macro _USER_VARIABLES"].zcalib_plugin_enabled %}
  {% set probe_type_enabled = printer["gcode_macro _USER_VARIABLES"].probe_type_enabled %}

  {% if probe_type_enabled == "cartographer_survey" %}
      CARTOGRAPHER_TOUCH_HOME
  {% else %}
      G28 Z
  {% endif %}

  {% if zcalib_plugin_enabled %}
      CALIBRATE_Z
  {% endif %}

[gcode_macro _MODULE_EXTRUDER_PREHEATING]
gcode:
    # Preheat the nozzle to safe probing temperature.
    {% set safe_extruder_temp = printer["gcode_macro _USER_VARIABLES"].safe_extruder_temp|float %}
    {% set status_leds_enabled = printer["gcode_macro _USER_VARIABLES"].status_leds_enabled %}
    {% set probe_type_enabled = printer["gcode_macro _USER_VARIABLES"].probe_type_enabled %}
    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}

    {% if status_leds_enabled %}
        STATUS_LEDS COLOR="HEATING"
    {% endif %}
    {% if verbose %}
        RESPOND MSG="Pre-heating the nozzle to a safe temperature..."
    {% endif %}

    {% if probe_type_enabled == "vorontap" or probe_type_enabled == "cartographer_survey" %}
        M109 S{safe_extruder_temp}
        {% if verbose %}
            RESPOND MSG="Extruder at safe temperature of {safe_extruder_temp} degrees"
        {% endif %}        
    {% else %}
        {% if printer.extruder.target < safe_extruder_temp %}
            M104 S{safe_extruder_temp} 
            {% if verbose %}
                RESPOND MSG="Extruder is heating at temperature of {safe_extruder_temp} degrees"
            {% endif %}
        {% else %}
            {% if verbose %}
                RESPOND MSG="Extruder is already hot"
            {% endif %}
        {% endif %}
    {% endif %}
